name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify version files and tag
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import tomllib

          package = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          init_text = pathlib.Path("four_u_four_free/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"$', init_text, re.MULTILINE)
          if not match:
              raise SystemExit("Could not read four_u_four_free.__version__")

          project_version = package["project"]["version"]
          module_version = match.group(1)
          if project_version != module_version:
              raise SystemExit(f"Version mismatch: pyproject={project_version}, module={module_version}")

          tag = "${{ github.ref_name }}"
          if tag.startswith("v") and tag[1:] != project_version:
              raise SystemExit(f"Tag {tag} does not match version {project_version}")
          print(f"Verified 4u4free {project_version}")
          PY

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[gui]" pyinstaller

      - name: Build Windows installer
        shell: cmd
        run: build_installer.bat

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/4u4free-*-Setup.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: find . -maxdepth 1 -type f -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
